<style>
/* Layout: 单列手机 App，底部五个标签；内容卡片在一条 640px 的中轴上 */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#4fbf9f; --accent-ink:#0d1a15; --brass:#e0b04a; --line:#2f3a35;

html,body{height:100%}

/* 课程路线 */
.path{display:flex;flex-direction:column;gap:0;position:relative}

.notice{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px}

<script>
"use strict";
/* ---------------- 存储（只存在本机浏览器） ---------------- */
const store={
  get(k,d){try{const v=localStorage.getItem("gtr."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("gtr."+k,JSON.stringify(v))}catch(e){}}
};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- 和弦数据：frets 从 6 弦（最粗）到 1 弦，-1 = 不弹 ---------------- */
const CHORDS={
  Em:{cn:"E 小调",f:[0,2,2,0,0,0],g:[0,2,3,0,0,0],lv:1},
  Em7:{cn:"E 小七（一指版）",f:[0,2,0,0,0,0],g:[0,2,0,0,0,0],lv:1},
  Am:{cn:"A 小调",f:[-1,0,2,2,1,0],g:[0,0,2,3,1,0],lv:1},
  C:{cn:"C 大调",f:[-1,3,2,0,1,0],g:[0,3,2,0,1,0],lv:1},
  G:{cn:"G 大调",f:[3,2,0,0,0,3],g:[2,1,0,0,0,3],lv:1},
  D:{cn:"D 大调",f:[-1,-1,0,2,3,2],g:[0,0,0,1,3,2],lv:1},
  E:{cn:"E 大调",f:[0,2,2,1,0,0],g:[0,2,3,1,0,0],lv:2},
  A:{cn:"A 大调",f:[-1,0,2,2,2,0],g:[0,0,1,2,3,0],lv:2},
  Dm:{cn:"D 小调",f:[-1,-1,0,2,3,1],g:[0,0,0,2,3,1],lv:2},
  Fmaj7:{cn:"F 大七（F 的简化版）",f:[-1,-1,3,2,1,0],g:[0,0,3,2,1,0],lv:2},
  Cadd9:{cn:"C 加九",f:[-1,3,2,0,3,0],g:[0,2,1,0,3,0],lv:2},
  Asus2:{cn:"A 挂二",f:[-1,0,2,2,0,0],g:[0,0,1,2,0,0],lv:2},
  Dsus4:{cn:"D 挂四",f:[-1,-1,0,2,3,3],g:[0,0,0,1,2,3],lv:2},
  G7:{cn:"G 属七",f:[3,2,0,0,0,1],g:[3,2,0,0,0,1],lv:2},
  C7:{cn:"C 属七",f:[-1,3,2,3,1,0],g:[0,3,2,4,1,0],lv:3},
  A7:{cn:"A 属七",f:[-1,0,2,0,2,0],g:[0,0,2,0,3,0],lv:2},
  D7:{cn:"D 属七",f:[-1,-1,0,2,1,2],g:[0,0,0,2,1,3],lv:2},
  E7:{cn:"E 属七",f:[0,2,0,1,0,0],g:[0,2,0,1,0,0],lv:2},
  Fs:{nm:"F",cn:"F 小横按（4 弦版）",f:[-1,-1,3,2,1,1],g:[0,0,3,2,1,1],barre:{fret:1,from:4,to:5},lv:3},
  F:{cn:"F 大横按",f:[1,3,3,2,1,1],g:[1,3,4,2,1,1],barre:{fret:1,from:0,to:5},lv:4},
  Bm:{cn:"B 小调（横按）",f:[-1,2,4,4,3,2],g:[0,1,3,4,2,1],barre:{fret:2,from:1,to:5},lv:4},
};
const chordName=k=>(CHORDS[k]&&CHORDS[k].nm)||k;
const OPEN_MIDI=[40,45,50,55,59,64]; // E2 A2 D3 G3 B3 E4
const STRINGS=[
  {n:6,note:"E",oct:2,midi:40,hint:"最粗"},
  {n:5,note:"A",oct:2,midi:45,hint:""},
  {n:4,note:"D",oct:3,midi:50,hint:""},
  {n:3,note:"G",oct:3,midi:55,hint:""},
  {n:2,note:"B",oct:3,midi:59,hint:""},
  {n:1,note:"E",oct:4,midi:64,hint:"最细"},
];
const midiHz=m=>440*Math.pow(2,(m-69)/12);

function chordSVG(key){
  const c=CHORDS[key]; if(!c) return "";
  const frets=c.f.filter(x=>x>0); const max=Math.max(0,...frets); const min=frets.length?Math.min(...frets):1;
  const base=max>4?min:1; const X=i=>18+i*16.8, Y=k=>34+k*22;
  let s=`<svg viewBox="0 0 120 150" role="img" aria-label="${esc(chordName(key))} 和弦指法图">`;
  for(let k=0;k<=5;k++) s+=`<line x1="18" x2="102" y1="${Y(k)}" y2="${Y(k)}" stroke="var(--muted)" stroke-width="${k===0&&base===1?5:1.2}"/>`;
  for(let i=0;i<6;i++) s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(0)}" y2="${Y(5)}" stroke="var(--muted)" stroke-width="${1.6-i*0.15}"/>`;
  if(base>1) s+=`<text x="4" y="${Y(0)+15}" font-size="11" fill="var(--muted)">${base}</text>`;
  if(c.barre){const b=c.barre,y=Y(b.fret-base)+11;s+=`<rect x="${X(b.from)-7}" y="${y-7}" width="${X(b.to)-X(b.from)+14}" height="14" rx="7" fill="var(--accent)"/>`}
  c.f.forEach((f,i)=>{
    if(f<0) s+=`<text x="${X(i)}" y="25" font-size="13" text-anchor="middle" fill="var(--muted)">×</text>`;
    else if(f===0) s+=`<circle cx="${X(i)}" cy="21" r="4.5" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
    else{
      const y=Y(f-base)+11;
      const inBarre=c.barre&&f===c.barre.fret&&i>=c.barre.from&&i<=c.barre.to;
      if(!inBarre) s+=`<circle cx="${X(i)}" cy="${y}" r="7.5" fill="var(--accent)"/>`;
      if(c.g[i]&&(!inBarre||i===c.barre.from)) s+=`<text x="${X(i)}" y="${y+4}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--accent-ink)">${c.g[i]}</text>`;
    }
  });
  ["6","5","4","3","2","1"].forEach((n,i)=>s+=`<text x="${X(i)}" y="146" font-size="9" text-anchor="middle" fill="var(--muted)">${n}</text>`);
  return s+"</svg>";
}
function chordCard(key){
  return `<div class="cd"><button data-play="${key}" aria-label="听 ${esc(chordName(key))} 和弦"><div class="nm">${esc(chordName(key))}</div><div class="cn">${esc(CHORDS[key].cn)}</div>${chordSVG(key)}</button></div>`;
}

/* ---------------- 声音：拨弦合成（Karplus-Strong） ---------------- */
let AC=null;
function ac(){ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()} if(AC.state==="suspended") AC.resume(); return AC }
const pluckCache={};
function pluckBuffer(midi){
  const ctx=ac(); if(pluckCache[midi]) return pluckCache[midi];
  const sr=ctx.sampleRate, f=midiHz(midi), N=Math.max(2,Math.round(sr/f-0.5)), len=Math.floor(sr*2.4);
  const buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0), ring=new Float32Array(N);
  for(let i=0;i<N;i++) ring[i]=Math.random()*2-1;
  // 轻微低通，让声音更像尼龙/钢弦而不是噪声
  for(let i=1;i<N;i++) ring[i]=0.6*ring[i]+0.4*ring[i-1];
  const decay=midi<50?0.996:0.994; let p=0;
  for(let i=0;i<len;i++){const n=(p+1)%N;const v=ring[p];d[i]=v;ring[p]=decay*0.5*(v+ring[n]);p=n}
  return pluckCache[midi]=buf;
}
const master=()=>{const ctx=ac(); if(!ac.m){ac.m=ctx.createGain();ac.m.gain.value=0.5;ac.m.connect(ctx.destination)} return ac.m};
function pluck(midi,t,vel=0.6){
  const ctx=ac(), src=ctx.createBufferSource(), g=ctx.createGain();
  src.buffer=pluckBuffer(midi); g.gain.value=vel; src.connect(g); g.connect(master()); src.start(t);
  return {src,g};
}
const ringing=[];
function strum(key,t,dir="D",vel=0.55){
  const c=CHORDS[key]; if(!c) return; const ctx=ac(); t=t??ctx.currentTime+0.02;
  ringing.splice(0).forEach(r=>{try{r.g.gain.setTargetAtTime(0,t,0.03)}catch(e){}});
  let idx=[0,1,2,3,4,5]; if(dir==="U") idx=[5,4,3,2]; // 上扫只扫细的几根
  idx.forEach((i,k)=>{const f=c.f[i]; if(f<0) return; ringing.push(pluck(OPEN_MIDI[i]+f,t+k*(dir==="U"?0.012:0.016),dir==="U"?vel*0.7:vel))});
}
function refTone(midi){
  // 调音用的标准音：用振荡器保证音高精确
  const ctx=ac(), t=ctx.currentTime, g=ctx.createGain(); g.connect(master());
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
  [[1,"triangle",1],[2,"sine",0.35],[3,"sine",0.15]].forEach(([h,type,a])=>{
    const o=ctx.createOscillator(),og=ctx.createGain(); o.type=type; o.frequency.value=midiHz(midi)*h; og.gain.value=a; o.connect(og); og.connect(g); o.start(t); o.stop(t+2.7);
  });
}
function click(t,accent){
  const ctx=ac(), o=ctx.createOscillator(), g=ctx.createGain();
  o.frequency.value=accent?1600:1050; g.gain.setValueAtTime(accent?0.55:0.32,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g); g.connect(master()); o.start(t); o.stop(t+0.06);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-play]"); if(b) strum(b.dataset.play)});

 {unit:"第四站 · 节奏",t:"扫弦节奏入门",m:12,goal:"跟着节拍器稳定扫弦，学会两个最常用的节奏型。",body:`

function median(a){const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]}
function detectPitch(buf,sr){
  // 自相关音高检测（只看 60~1200Hz 的周期范围）
  let n=buf.length, rms=0; for(let i=0;i<n;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/n); if(rms<0.008) return -1;
  const minLag=Math.floor(sr/1200), maxLag=Math.min(Math.floor(sr/60),n>>1), W=n-maxLag;
  const c=new Float32Array(maxLag+2);
  for(let lag=minLag;lag<=maxLag+1;lag++){let s=0;for(let i=0;i<W;i++) s+=buf[i]*buf[i+lag]; c[lag]=s}
  let e0=0; for(let i=0;i<W;i++) e0+=buf[i]*buf[i];
  // 取第一个超过最大值 90% 的峰，避免跳到低八度
  let mx=0; for(let l=minLag;l<=maxLag;l++) if(c[l]>mx) mx=c[l];
  if(mx<e0*0.3) return -1;
  let lag=-1; for(let l=minLag+1;l<=maxLag;l++){ if(c[l]>c[l-1]&&c[l]>=c[l+1]&&c[l]>0.9*mx){lag=l;break} }
  if(lag<0) return -1;
  const a=c[lag-1],b=c[lag],d=c[lag+1], sh=(a-d)/(2*(a-2*b+d)||1);
  return sr/(lag+(isFinite(sh)?sh:0));
}

function pageRhythm(app,r){
  const p=PRESETS[r.preset]; if(p){Object.assign(RS,p);if(p.prog){RS.progList=null}}
  if(r.preset&&r.preset.startsWith("song-")){const s=SONGS.find(x=>x.id===r.preset.slice(5)); if(s){RS.bpm=s.bpm;RS.pat=s.pat;RS.progList=s.prog;RS.prog="__song:"+s.t}}
  const progOptions=Object.keys(PROGS).map(k=>`<option value="${k}">${k}</option>`).join("")+(RS.progList?`<option value="${esc(RS.prog)}">${esc(RS.prog.replace("__song:","曲子：")+"")}</option>`:"");
  app.innerHTML=`<h1>节奏</h1><p class="muted small">节拍器和扫弦跟练在一起：选好节奏型和和弦，App 替你弹伴奏，你跟着高亮的箭头扫。</p>
  <div class="card stack">
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="rMinus" aria-label="减慢">−5</button>
      <div style="text-align:center"><div class="bpm" id="rBpm">${RS.bpm}</div><div class="small muted">每分钟拍数</div></div>
      <button class="btn" id="rPlus" aria-label="加快">+5</button>
    </div>
    <input type="range" id="rRange" min="40" max="180" value="${RS.bpm}" aria-label="速度">
    <div class="row"><button class="btn primary big" id="rPlay" style="flex:1">开始</button><button class="btn big" id="rTap">打拍子测速</button></div>
  </div>
  <div class="card stack" style="margin-top:14px">
    <label class="small">节奏型<br><select id="rPat" style="width:100%">${Object.entries(PATTERNS).map(([k,v])=>`<option value="${k}">${v.t}</option>`).join("")}</select></label>
    <div class="beats" id="rBeats"></div>
    <label class="small">和弦进行（每个和弦一小节）<br><select id="rProg" style="width:100%">${progOptions}</select></label>
    <div class="prog" id="rProgView"></div>
    <div class="nowchord"><div class="big" id="rNow">–</div><div style="width:110px" id="rNowSvg"></div><div class="small muted" id="rNext"></div></div>
    <div class="row small"><label class="row" style="gap:6px"><input type="checkbox" id="rStrum" ${RS.strumOn?"checked":""} style="accent-color:var(--accent)">App 弹伴奏</label><label class="row" style="gap:6px"><input type="checkbox" id="rClick" checked style="accent-color:var(--accent)">节拍声</label></div>
  </div>
  <div class="card small" style="margin-top:14px"><b>练法：</b>先关掉"App 弹伴奏"，只听节拍声自己扫；跟不上就把速度降到 50～60。能连续弹 4 遍不停，再每次加 5。</div>`;
  $("#rPat").value=RS.pat; $("#rProg").value=RS.progList?RS.prog:RS.prog;
  const prog=()=>RS.progList&&RS.prog.startsWith("__song:")?RS.progList:(PROGS[RS.prog]||PROGS["C G"]);
  function paintBeats(){
    const P=PATTERNS[RS.pat], lb=P.beats===3?["1","嗒","2","嗒","3","嗒"]:["1","嗒","2","嗒","3","嗒","4","嗒"];
    $("#rBeats").style.gridTemplateColumns=`repeat(${P.slots.length},1fr)`;
    $("#rBeats").innerHTML=P.slots.map((s,i)=>`<div class="beat" data-i="${i}"><div class="ar">${s==="D"?"↓":s==="U"?"↑":"·"}</div><div class="lb">${lb[i]}</div></div>`).join("");
    $("#rProgView").innerHTML=prog().map((c,i)=>`<span data-i="${i}">${esc(chordName(c))}</span>`).join("");
    showChord(0);
  }
  function showChord(bar){
    const pr=prog(), c=pr[bar%pr.length], nx=pr[(bar+1)%pr.length];
    $("#rNow").textContent=chordName(c); $("#rNowSvg").innerHTML=chordSVG(c); $("#rNext").textContent=`下一个：${chordName(nx)}`;
    $$("#rProgView span").forEach((s,i)=>s.classList.toggle("now",i===bar%pr.length));
  }
  const setBpm=v=>{RS.bpm=Math.max(40,Math.min(180,Math.round(v)));store.set("bpm",RS.bpm);$("#rBpm").textContent=RS.bpm;$("#rRange").value=RS.bpm};
  $("#rMinus").onclick=()=>setBpm(RS.bpm-5); $("#rPlus").onclick=()=>setBpm(RS.bpm+5); $("#rRange").oninput=e=>setBpm(+e.target.value);
  $("#rPat").onchange=e=>{RS.pat=e.target.value;store.set("pat",RS.pat);restartIfPlaying();paintBeats()};
  $("#rProg").onchange=e=>{RS.prog=e.target.value;if(!RS.prog.startsWith("__song:")){store.set("prog",RS.prog)}restartIfPlaying();paintBeats()};
  $("#rStrum").onchange=e=>{RS.strumOn=e.target.checked;store.set("strumOn",RS.strumOn)};
  $("#rClick").onchange=e=>{RS.clickOn=e.target.checked};
  let taps=[]; $("#rTap").onclick=()=>{const t=performance.now(); taps=taps.filter(x=>t-x<3000); taps.push(t); if(taps.length>=3){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1); setBpm(60000/iv)}};
  function restartIfPlaying(){if(transport){stopT();startT()}}
  function startT(){
    const ctx=ac(); const P=PATTERNS[RS.pat]; let step=0, next=ctx.currentTime+0.12; const q=[];
    const sched=()=>{const dur=60/RS.bpm/2; while(next<ctx.currentTime+0.12){
        const slot=step%P.slots.length, bar=Math.floor(step/P.slots.length), pr=prog();
        if(RS.clickOn&&slot%2===0) click(next,slot===0);
        const s=P.slots[slot]; if(RS.strumOn&&(s==="D"||s==="U")) strum(pr[bar%pr.length],next,s,slot===0?0.6:0.45);
        q.push({t:next,slot,bar}); next+=dur; step++; }};
    sched(); const iv=setInterval(sched,25);
    let lastBar=-1; const draw=()=>{const now=ctx.currentTime; while(q.length&&q[0].t<=now){const e=q.shift();
        $$("#rBeats .beat").forEach((b,i)=>b.classList.toggle("now",i===e.slot)); if(e.bar!==lastBar){lastBar=e.bar;showChord(e.bar)}}
      transport.raf=requestAnimationFrame(draw)};
    transport={iv,raf:requestAnimationFrame(draw)}; $("#rPlay").textContent="停止"; markPracticed();
  }
  function stopT(){ if(!transport) return; clearInterval(transport.iv); cancelAnimationFrame(transport.raf); transport=null; ringing.splice(0).forEach(r=>{try{r.g.gain.setTargetAtTime(0,ac().currentTime,0.05)}catch(e){}});
    const b=$("#rPlay"); if(b) b.textContent="开始"; $$("#rBeats .beat").forEach(b=>b.classList.remove("now")); }
  $("#rPlay").onclick=()=>transport?stopT():startT();
  paintBeats();
  cleanup=stopT;
}

/* ---------------- 曲子页 ---------------- */
function pageSongs(app,r){
  const s=r.id&&SONGS.find(x=>x.id===r.id);
  if(!s){
    app.innerHTML=`<h1>入门曲子</h1><p class="muted small">全部是不受版权限制的公版曲目，从易到难排。先在"和弦"页确认每个和弦都会按。</p>
    <div class="stack">${SONGS.map(x=>`<a class="card" href="#song-${x.id}" style="text-decoration:none;color:inherit;display:block"><div class="row" style="justify-content:space-between"><b style="font-size:18px">${esc(x.t)}</b><span class="chip">${PATTERNS[x.pat].beats}/4 拍 · ${x.bpm}</span></div><div class="prog" style="margin-top:6px">${x.chords.map(c=>`<span>${esc(chordName(c))}</span>`).join("")}</div></a>`).join("")}</div>`;
    return;
  }
  app.innerHTML=`<a href="#songs" class="small">← 全部曲子</a><h1>${esc(s.t)}</h1>
  <p class="muted small">${esc(s.note)}</p>
  <div class="row"><a class="btn primary" href="#rhythm-song-${s.id}">跟着伴奏练（${PATTERNS[s.pat].t.split(" ")[0]} · ${s.bpm}）</a></div>
  <h2 style="margin-top:16px">用到的和弦</h2><div class="diagrams">${s.chords.map(chordCard).join("")}</div>
  <h2 style="margin-top:16px">和弦谱</h2><p class="small muted">和弦标在字的上方，唱到那个字时换和弦。</p>
  <div class="card sheet">${s.lines.map(l=>`<div class="line">${l.map(([c,w])=>`<span class="seg"><span class="c">${esc(chordName(c))}</span><span class="w">${esc(w)||"&nbsp;"}</span></span>`).join("")}</div>`).join("")}</div>`;
}

/* 首次进入 */
render();
</script>
</body></html>
